# Every morning, check ESPN for new Liga BetPlay results and save them to
# data/matches.csv. If anything changed, the file is committed to the repo,
# and Streamlit Community Cloud picks up the new commit and refreshes the app.
name: Update results

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 5:17 AM in Colombia, after the night games
  workflow_dispatch:         # adds a "Run workflow" button on GitHub to run it by hand

permissions:
  contents: write            # lets the job commit the updated CSV

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas requests

      - name: Get new results from ESPN
        run: python src/update_results.py

      - name: Save them to the repo (only if something changed)
        run: |
          if git diff --quiet data/matches.csv; then
            echo "No new results."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/matches.csv
            git commit -m "Daily results update from ESPN"
            git push
          fi
